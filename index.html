<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift — collect what catches your eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EEE6;
    --paper-raised:#FAF8F3;
    --ink:#211F1B;
    --ink-soft:#5B584F;
    --line:#DFD9C9;
    --moss:#3F5D4E;
    --moss-dark:#2C4136;
    --mustard:#C68A1F;
    --rose:#B5717A;
    --sky:#5C7C8A;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  header{
    position:sticky;top:0;z-index:40;
    background:rgba(241,238,230,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1400px;margin:0 auto;
    display:flex;align-items:center;gap:24px;
    padding:14px 28px;
  }
  .logo{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:24px;
    letter-spacing:-0.01em;
    display:flex;align-items:center;gap:6px;
    flex-shrink:0;
  }
  .logo .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--moss);display:inline-block;
    font-style:normal;
  }
  .search-wrap{
    flex:1;max-width:640px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:11px 20px 11px 42px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-wrap input:focus{
    border-color:var(--moss);
    box-shadow:0 0 0 3px rgba(63,93,78,0.12);
  }
  .search-wrap svg{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    opacity:0.5;
  }
  .header-actions{
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid transparent;
    color:var(--ink);position:relative;
  }
  .icon-btn:hover{background:var(--paper-raised);border-color:var(--line);}
  .saved-badge{
    position:absolute;top:-2px;right:-2px;
    background:var(--rose);color:#fff;
    font-family:'Space Mono',monospace;
    font-size:9px;font-weight:700;
    min-width:15px;height:15px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }
  .avatar{
